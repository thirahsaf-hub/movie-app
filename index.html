<!DOCTYPE html>
<html>
<head>
    <title>MyMovie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">

        <h1>HBO MIN</h1>

        <nav>
        <!--Event handling-->
            <button onclick="location.href='watchlist.html'">
                Watchlist
            </button>

            <button onclick="location.href='payment.html'">
                Payment
            </button>

            <button onclick="location.href='history.html'">
                History
            </button>

            <button onclick="location.href='review.html'">
                Reviews
            </button>

        </nav>
    </div>

    <hr>

    <!-- Search & Filter Section -->
    <div class="search-section">
        <input type="text" id="searchData" placeholder="Search movie title...">

        <!-- Genre Dropdown Menu -->
        <select id="genreSelect" onchange="suggestByCategory()"><!--Event handling-->
            <option value="">-- Select Category / Genre --</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Horror">Horror</option>
            <option value="Animation">Animation</option>
            <option value="Documentary">Documentary</option>
            <option value="Sci-Fi">Sci-Fi</option>
        </select>

        <button onclick="buttonClicked()">
            Search
        </button>
    </div>

    <!-- Search Result -->

    <br>
    <div id="movieResult"></div>

    <br>

    <!-- BANNER -->

    <div class="hero">

        <h1>Avatar : The Way Of Water</h1>

        <p>Stream the Biggest Fantasy Movie of All Time</p>

    </div>

    <!-- Purchased movie appear as continue watching -->

    <h2>Continue Watching</h2>

    <div id="continueWatching"></div>

    <!-- TRENDING -->

    <h2>Trending Now</h2>

    <div class="movie-row">

        <img src="clayface-poster.jpg">

        <img src="othermommy.jpg">

        <img src="buddy.jpg">

        <img src="obsession.jpg">

    </div>

    <!-- HORROR -->

    <h2>Horror</h2>

    <div class="movie-row">

        <img src="obsession.jpg">

        <img src="othermommy.jpg">

        <img src="mirrors.jpg">

    </div>

    <!-- ROMCOM -->

    <h2>Romantic Comedy</h2>

    <div class="movie-row">

        <img src="how.jpg">

        <img src="things.jpg">

        <img src="obs.jpg">

    </div>

    <script src="fetch.js"></script>

    <script>


    window.onload = function(){

        let transactions =
        //Convert string into Javascript array
        JSON.parse( 
            localStorage.getItem("transactions")
        ) || []; //if nothing exist, then empty array will be created

        let output =
        '<div class="movie-row">';

        transactions.forEach(function(movie){

            if(movie.poster){

                output += `
                    <img src="${movie.poster}">
                `;
            }
        });

        output += "</div>";

        document.getElementById(
            "continueWatching"
        ).innerHTML = output;
    }

    </script>

</body>
</html>
